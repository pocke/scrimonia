name: Typing Game

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typing_game
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # `@types/node` を `^24.10.1` で指定しているので、ローカルの型と
      # ランタイムの型を合わせるため Node 24 を使う。
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typing_game/package-lock.json

      - run: npm ci

      # ESLint。設定は typing_game/eslint.config.js。
      - run: npm run lint

      # tsc -b (型検査) + vite build (バンドル) を順に実行する。
      - run: npm run build
